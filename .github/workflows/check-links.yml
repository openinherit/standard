name: Check links

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.github/workflows/check-links.yml'
  pull_request:
    paths:
      - '**.md'
      - '.github/workflows/check-links.yml'

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-path node_modules
            --exclude-path .git
            --exclude 'https://ntfy\.sh/'
            --exclude 'mailto:'
            --exclude 'https://www\.openinherit\.org'
            --max-retries 3
            --timeout 30
            '**/*.md'
          fail: true
