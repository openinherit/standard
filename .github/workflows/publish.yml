name: Publish to npm

# Fires only on a version tag. scripts/release.sh creates that tag; nothing
# else should. A mis-aimed publish to a public scope cannot be taken back, so
# there is deliberately no workflow_dispatch here.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # required to mint npm provenance attestations

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Without this, an absent token surfaces as an E401 several minutes into
      # the job, after the tag already exists. Say it in ten seconds instead.
      - name: Refuse to start without a publish token
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set on this repository. Add it under"
            echo "::error::Settings > Secrets and variables > Actions before tagging a release."
            exit 1
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @openinherit/sdk run build

      - name: Publish @openinherit/schema
        run: pnpm --filter @openinherit/schema publish --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @openinherit/sdk
        run: pnpm --filter @openinherit/sdk publish --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @openinherit/conformance
        run: pnpm --filter @openinherit/conformance publish --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The website rebuilds itself once the packages are live. Its workflow
      # listens on repository_dispatch: types: [extension-update].
      - name: Notify the website to rebuild
        continue-on-error: true
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::notice::WWW_DISPATCH_TOKEN is not set; skipping the website rebuild notification."
            exit 0
          fi
          gh api repos/openinherit/code-www/dispatches \
            --method POST \
            -f event_type=extension-update
        env:
          GH_TOKEN: ${{ secrets.WWW_DISPATCH_TOKEN }}
