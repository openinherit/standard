name: Release Wiring

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # No install step: the check is dependency-free on purpose, so it still
      # runs when the lockfile is what broke.
      - name: The repository can release what it promises to release
        run: node scripts/check-release-wiring.mjs

      - name: The wiring check can go red
        run: node scripts/test-check-release-wiring.mjs

      # release-policy.mjs is the support window and the dist-tag as machinery;
      # publish.yml and release.sh run it. Prove each refusal on injected input.
      - name: The release policy refuses what the support window does not allow
        run: node scripts/test-release-policy.mjs

      # publish.yml runs the contents check against the tag. Running it here too
      # means a root schema or reference-data edit that is not copied into
      # packages/schema reds the PR that makes it, not the tag pushed weeks later.
      - name: What would be published mirrors the standard
        run: node scripts/check-release-contents.mjs

      # Here we prove each of its assertions can refuse, on synthetic trees.
      - name: The release contents check can go red
        run: node scripts/test-check-release-contents.mjs
