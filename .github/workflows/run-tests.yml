name: Test Suite

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run test suite
        run: pnpm test

      # coOwnership is declared on the core asset and on two categories; under
      # allOf all of them apply, so they must stay identical. Also refuses a
      # reference-data rule that names a coOwnership field no schema declares.
      - name: Co-ownership declarations agree
        run: pnpm run test:co-ownership

      # Every tax jurisdiction says whether it levies a death tax, so an empty
      # rates array can be told apart from a jurisdiction nobody has modelled.
      - name: Death-tax-levied flag is declared and consistent
        run: pnpm run test:death-tax-levied

      # Proposals are cited by number, so each has its own and its heading
      # agrees. Two proposals merged on one day both took 0005.
      - name: Proposal numbers are unique
        run: pnpm run test:proposal-numbers

      # The UK and Irish extensions say what real property is held under: local
      # tenure, and for Northern Ireland and Ireland which register (land registry
      # folio or Registry of Deeds) and what class of title. Every value must have
      # a valid test case, and none can be removed silently.
      - name: Real-property vocabulary is declared and exercised
        run: pnpm run test:real-property-vocabulary

      # The asset category vocabulary has one source, v3/asset.json's category
      # enum. Its copies (allOf routing, reference-data, vendored bundles,
      # generated SDK types, docs) must agree with it, and every file that
      # mentions it must be in scripts/data/asset-category-copies.json.
      # Exit 2 (cannot answer) fails the step.
      - name: Asset category vocabulary copies agree with the schema
        run: pnpm run test:asset-category-vocabulary

      # Archive timestamp chains (RFC 4998 evidence records on attestations):
      # the schema's algorithm enums match reference-data/algorithm-lifecycle-
      # registry.json, and every fixture chain is in time order, keeps its hash
      # on a timestamp renewal and used only algorithms allowed at the time.
      # The hermetic suite proves each rule can still go red. Exit 2 fails.
      - name: Archive timestamp chains follow RFC 4998 and the algorithm lifecycle
        run: pnpm run test:archive-timestamp-chain

      # Every Catala body, Cedar policy and verdict fixture declares the one
      # jurisdiction it is written for, as a key of jurisdiction-profiles.json
      # (or jurisdiction-neutral). A filename or a comment is not a declaration.
      # The hermetic suite proves the check can still go red. Exit 2 fails.
      - name: Rule bodies and verdict fixtures declare their jurisdiction
        run: pnpm run test:rule-jurisdiction

      # The Cedar service-eligibility packs key on serviceType strings defined in
      # reference-data/regulated-service-types.json, with a statutory status per
      # jurisdiction; each jurisdiction with a pack has a will-requirements profile.
      # The two must agree, the reserved lines cannot be downgraded and pinned
      # requirements (Scotland's prior and legal rights) cannot be dropped. The
      # hermetic suite proves each rule can still go red. Exit 2 fails.
      - name: Service-eligibility packs agree with their reference data
        run: pnpm run test:service-eligibility-reference-data

      # Level 2 — referential integrity. Nothing in CI ran this until now, so
      # every cross-reference rule in scripts/validate-refs.mjs was advisory:
      # deleting one left the build green.
      - name: Referential-integrity rules match the declared constraints
        run: pnpm run test:refs

      - name: Referential integrity across every fixture
        run: pnpm run validate:refs:all

      # Proposal 0003 — catalogue-only is a conformance profile of the root.
      # Each catalogue fixture must declare the profile, carry no estate, and
      # validate against v3/schema.json unwrapped; stripping the declaration
      # must make the root refuse it. Exit 2 (cannot answer) fails the step.
      - name: Catalogue fixtures conform to the root at the catalogue profile
        run: pnpm run test:catalogue-profile

      # The policy is what an implementer reads to write a declaration. This
      # fails if the policy and v3/conformance-declaration.json disagree on a
      # field or a document root, if the policy cites a removed v1/v2 path, or
      # if one of its examples would not validate.
      - name: Conformance-declaration policy matches its schema
        run: pnpm run test:conformance-declaration-policy

      # The 22 extension schemas and 5 asset categories were never linted:
      # package.json's lint names them only as --resolve arguments. This lints
      # every schema under v3/ and refuses any finding above the pinned
      # baseline, which may only fall. Exit 2 (cannot answer) fails the step.
      - name: Every schema in v3/ is linted, and no new finding lands
        run: pnpm run lint:schemas

      - name: The schema lint check can go red
        run: pnpm run test:lint-schemas

      # A paths: filter that matches no tracked file stops its workflow running
      # at all. validate-schemas.yml filtered on v2/**, which never existed.
      - name: Every workflow path filter matches a tracked file
        run: node scripts/check-workflow-path-filters.mjs

      - name: The path filter check can go red
        run: pnpm run test:workflow-path-filters
