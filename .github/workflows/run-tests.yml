name: Test Suite

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run test suite
        run: pnpm test

      # coOwnership is declared on the core asset and on two categories; under
      # allOf all of them apply, so they must stay identical. Also refuses a
      # reference-data rule that names a coOwnership field no schema declares.
      - name: Co-ownership declarations agree
        run: pnpm run test:co-ownership

      # Every tax jurisdiction says whether it levies a death tax, so an empty
      # rates array can be told apart from a jurisdiction nobody has modelled.
      - name: Death-tax-levied flag is declared and consistent
        run: pnpm run test:death-tax-levied

      # Level 2 — referential integrity. Nothing in CI ran this until now, so
      # every cross-reference rule in scripts/validate-refs.mjs was advisory:
      # deleting one left the build green.
      - name: Referential-integrity rules match the declared constraints
        run: pnpm run test:refs

      - name: Referential integrity across every fixture
        run: pnpm run validate:refs:all

      # Proposal 0003 — catalogue-only is a conformance profile of the root.
      # Each catalogue fixture must declare the profile, carry no estate, and
      # validate against v3/schema.json unwrapped; stripping the declaration
      # must make the root refuse it. Exit 2 (cannot answer) fails the step.
      - name: Catalogue fixtures conform to the root at the catalogue profile
        run: pnpm run test:catalogue-profile

      # The policy is what an implementer reads to write a declaration. This
      # fails if the policy and v3/conformance-declaration.json disagree on a
      # field or a document root, if the policy cites a removed v1/v2 path, or
      # if one of its examples would not validate.
      - name: Conformance-declaration policy matches its schema
        run: pnpm run test:conformance-declaration-policy
