name: Validate Examples

on:
  push:
    branches:
      - main
    paths:
      - 'v3/**'
      - 'examples/fixtures/**'
      - 'examples/wills/**'
      - 'scripts/test-cross-border-fixture.mjs'
      - 'scripts/validate-refs.mjs'
      - 'scripts/validate-net-equity.mjs'
      - 'reference-data/jurisdiction-*.json'
      - 'extensions-registry.json'
      - 'scripts/check-jurisdiction-cascade.py'
  pull_request:
    paths:
      - 'v3/**'
      - 'examples/fixtures/**'
      - 'examples/wills/**'
      - 'scripts/test-cross-border-fixture.mjs'
      - 'scripts/validate-refs.mjs'
      - 'scripts/validate-net-equity.mjs'
      - 'reference-data/jurisdiction-*.json'
      - 'extensions-registry.json'
      - 'scripts/check-jurisdiction-cascade.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Sourcemeta CLI
        run: |
          curl -sSL https://github.com/sourcemeta/jsonschema/releases/latest/download/jsonschema-linux-x86_64 -o /usr/local/bin/jsonschema
          chmod +x /usr/local/bin/jsonschema

      - name: Validate example fixtures
        run: pnpm run validate:examples

      - name: Referential integrity — Space/Liability round-trip fixture
        run: node scripts/validate-refs.mjs examples/fixtures/spaces-and-liabilities-estate.json

      - name: Net equity — derivation matches the stored figures
        run: node scripts/validate-net-equity.mjs examples/fixtures/spaces-and-liabilities-estate.json

      # A checker that has silently stopped checking passes every positive test
      # it has. net-equity-mismatch.json is deliberately wrong and structurally
      # valid; asserting it STILL fails is what stops validate-net-equity.mjs
      # decaying into a no-op, and it is the only step that would catch someone
      # "correcting" that fixture's number.
      - name: Net equity — the negative probe must still bite
        run: |
          if node scripts/validate-net-equity.mjs examples/fixtures/net-equity-mismatch.json; then
            echo "::error::net-equity-mismatch.json validated — the net-equity check has stopped biting"
            exit 1
          fi
          echo "Negative probe correctly rejected"

      - name: Cross-border fixture expresses connecting factors
        run: pnpm run test:cross-border

      - name: Jurisdiction cascade is declared, not truncated
        run: pnpm run test:cascade

      - name: The cascade gate can still go red
        run: bash scripts/test-check-jurisdiction-cascade.sh
