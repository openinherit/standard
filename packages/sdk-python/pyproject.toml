[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openinherit"
version = "6.0.0"
description = "INHERIT open estate data standard — Python validation SDK"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "jsonschema[format]>=4.23",
    "referencing>=0.35",
    "pydantic[email]>=2.0",
]

[project.urls]
Homepage = "https://openinherit.org"
Repository = "https://github.com/openinherit/standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
